name: Release

# Manual on purpose: it needs the signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) to be
# configured first. Run it from the Actions tab and enter the tag to create, for example v0.2.0.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BYTEBRIEF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          BYTEBRIEF_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          BYTEBRIEF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BYTEBRIEF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$BYTEBRIEF_KEYSTORE" "$BYTEBRIEF_STORE_PASSWORD" "$BYTEBRIEF_KEY_ALIAS" "$BYTEBRIEF_KEY_PASSWORD" > keystore.properties
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          rm -f keystore.properties

      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do mv "$f" "bytebrief-${RELEASE_TAG}-${f#app-}"; done
          sha256sum bytebrief-*.apk > SHA256SUMS
          gh release create "$RELEASE_TAG" bytebrief-*.apk SHA256SUMS --title "ByteBrief $RELEASE_TAG" --generate-notes
