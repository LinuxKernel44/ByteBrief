plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.bytebrief'
    compileSdk 37

    defaultConfig {
        applicationId 'app.bytebrief'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += "$projectDir/schemas".toString()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packaging {
        jniLibs {
            // llama.cpp loads its CPU backend variants from the native library directory at runtime.
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation project(':llama')
    implementation 'io.github.kyant0:backdrop:2.0.1'
    implementation 'io.github.kyant0:shapes:1.2.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.12.0'
    implementation 'org.jetbrains.compose.ui:ui:1.12.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jsoup:jsoup:1.23.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'org.json:json:20260814'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}
