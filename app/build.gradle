plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.bytebrief'
    compileSdk 37

    defaultConfig {
        applicationId 'app.bytebrief'
        minSdk 33
        targetSdk 36
        versionCode 4
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += ["$projectDir/schemas".toString(), "$projectDir/src/test/resources".toString()]
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        // Version-freshness hints are reviewed by hand: dependencies are pinned on purpose (see docs/DEPENDENCIES.md).
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion', 'UseKtx'
        // Android 16 (API 36) is the primary target; moving to 37 is a deliberate, separately tested change.
        disable 'OldTargetApi'
        // The notice only suggests an alternative way to read free space; getUsableSpace() is correct for a pre-download check.
        disable 'UsableSpace'
    }
    signingConfigs {
        release {
            // Credentials come from keystore.properties (git-ignored) or CI secrets; never from the repository.
            def props = new Properties()
            def f = rootProject.file('keystore.properties')
            if (f.exists()) f.withInputStream { props.load(it) }
            storeFile props.getProperty('storeFile') ? file(props.getProperty('storeFile')) : null
            storePassword props.getProperty('storePassword') ?: System.getenv('BYTEBRIEF_STORE_PASSWORD')
            keyAlias props.getProperty('keyAlias') ?: System.getenv('BYTEBRIEF_KEY_ALIAS')
            keyPassword props.getProperty('keyPassword') ?: System.getenv('BYTEBRIEF_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned release builds are still possible (for CI without secrets): signing applies only when configured.
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packaging {
        jniLibs {
            // llama.cpp loads its CPU backend variants from the native library directory at runtime.
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation project(':llama')
    implementation 'io.github.kyant0:backdrop:2.0.1'
    implementation 'io.github.kyant0:shapes:1.2.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.12.0'
    implementation 'org.jetbrains.compose.ui:ui:1.12.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jsoup:jsoup:1.23.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'org.json:json:20260814'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.work:work-testing:2.12.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}
